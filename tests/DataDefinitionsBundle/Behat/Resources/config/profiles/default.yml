default:
    formatters:
        pretty:
            verbose: true
            paths: false
            snippets: false

    extensions:
        FriendsOfBehat\SymfonyExtension:
            bootstrap: behat-bootstrap.php
            kernel:
                path: Kernel.php
                class: Kernel
                environment: test
    gherkin:
        filters:
            tags: '~@wip'
