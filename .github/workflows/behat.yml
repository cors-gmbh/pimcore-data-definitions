name: Behat
on:
  push:
    branches: [ '6.0' ]
  pull_request_target:
    branches: [ '6.0' ]

permissions:
  contents: read

env:
  APP_ENV: "test"
  IM_SKIP_DB_SETUP: "1"
  PIMCORE_TEST_DB_DSN: "mysql://root:root@127.0.0.1:3306/dd_test"
  PIMCORE_INSTALL_ADMIN_USERNAME: "admin"
  PIMCORE_INSTALL_ADMIN_PASSWORD: "admin"
  PIMCORE_INSTALL_MYSQL_HOST_SOCKET: "127.0.0.1"
  PIMCORE_INSTALL_MYSQL_USERNAME: "root"
  PIMCORE_INSTALL_MYSQL_PASSWORD: "root"
  PIMCORE_INSTALL_MYSQL_DATABASE: "dd_test"
  PIMCORE_INSTALL_MYSQL_PORT: "3306"
  PIMCORE_INSTALL_ENCRYPTION_SECRET: "${{ secrets.PIMCORE_ENCRYPTION_SECRET }}"
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
  PIMCORE_INSTALL_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"
  PIMCORE_PRODUCT_KEY: "${{ secrets.PIMCORE_PRODUCT_KEY }}"
  PIMCORE_ENCRYPTION_SECRET: "${{ secrets.PIMCORE_ENCRYPTION_SECRET }}"
  PIMCORE_INSTANCE_IDENTIFIER: "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
  PIMCORE_KERNEL_CLASS: 'Kernel'

jobs:
  behat:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ 8.3, 8.4 ]
        pimcore: [ ^12.0 ]
        dependencies: [ highest ]

    services:
      database:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    name: "${{ matrix.pimcore }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}"

    steps:
      - name: Checkout PR head (only for pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Checkout PR head (for push or other events)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
          extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib

      - name: Check PHP Version
        run: php -v

      - name: Setup DB
        run: |
          mysql --host 127.0.0.1 --port ${{ job.services.database.ports['3306'] }} -uroot -proot -e "CREATE DATABASE dd_test CHARSET=utf8mb4;"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - if: matrix.dependencies == 'highest'
        name: Install dependencies highest
        run: |
          composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update
          composer update --no-progress --prefer-dist --optimize-autoloader

      - if: matrix.dependencies == 'lowest'
        name: Install dependencies lowest
        run: |
          composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update
          composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest

      - name: Cache clear
        run: bin/console cache:clear

      - name: Assets Install
        run: bin/console assets:install --symlink

      - name: Install Pimcore
        run: PIMCORE_KERNEL_CLASS=Kernel vendor/bin/pimcore-install --env=test --skip-product-registration-config --skip-database-config --no-interaction

      - name: Install DataDefinitions
        run: bin/console pimcore:bundle:install DataDefinitionsBundle

      - name: Run Behat
        run: vendor/bin/behat --strict --no-interaction -vvv -f progress --config behat.yml.dist -p default

      - name: Upload Behat logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "Behat logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.pimcore }})"
          path: etc/build/
          if-no-files-found: ignore

      - name: Upload Pimcore logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "Pimcore logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.pimcore }})"
          path: var/log/
          if-no-files-found: ignore